[project]
name = "tavily-rag-agent"
version = "0.1.0"
description = "A small iterative web-retrieval RAG pipeline using Tavily."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Nam Hoang" }
]

dependencies = [
  "tavily-python>=0.5.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "scikit-learn>=1.3.0",
  "ollama>=0.6.1",
  "rich>=14.2.0",
]

[tool.uv]
package = true

[project.scripts]
tavily-rag = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
